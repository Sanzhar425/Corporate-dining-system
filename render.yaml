# Render.com Blueprint — "New + > Blueprint" арқылы осы файлды
# таңдасаңыз, веб-сервис пен PostgreSQL автоматты түрде құрылады.
# https://render.com/docs/blueprint-spec

databases:
  - name: dining-system-db
    plan: free

services:
  - type: web
    name: corporate-dining-system
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate --noinput && gunicorn dining_system.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: dining-system-db
          property: connectionString
