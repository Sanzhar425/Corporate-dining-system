<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Асхана — Мәзір</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #F5F0E8;
    --warm: #E8DCC8;
    --brown: #3D2B1F;
    --brown-mid: #7A5C44;
    --accent: #C4773A;
    --accent-light: #E8A86A;
    --white: #FDFAF5;
    --shadow: rgba(61,43,31,0.12);
    --green: #4A7C59;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    min-height: 100vh;
    color: var(--brown);
  }

  /* NAV */
  nav {
    background: var(--white);
    border-bottom: 1px solid var(--warm);
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px var(--shadow);
  }

  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--brown);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .nav-links { display: flex; gap: 4px; }

  .nav-link {
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    color: var(--brown-mid);
    text-decoration: none;
    transition: background 0.2s;
    font-weight: 400;
  }

  .nav-link:hover { background: var(--cream); }
  .nav-link.active { background: var(--cream); color: var(--accent); font-weight: 500; }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .balance-badge {
    background: var(--cream);
    border: 1.5px solid var(--warm);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 500;
    color: var(--brown-mid);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .balance-badge strong { color: var(--accent); }

  .cart-btn {
    background: var(--accent);
    color: var(--white);
    border: none;
    border-radius: 20px;
    padding: 8px 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.2s;
    position: relative;
  }

  .cart-btn:hover { background: #B36A30; }

  .cart-count {
    background: var(--white);
    color: var(--accent);
    border-radius: 50%;
    width: 20px;
    height: 20px;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* MAIN */
  main { max-width: 1100px; margin: 0 auto; padding: 36px 24px; }

  .page-title {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    margin-bottom: 6px;
  }

  .page-sub {
    color: var(--brown-mid);
    font-size: 14px;
    font-weight: 300;
    margin-bottom: 28px;
  }

  /* CATEGORIES */
  .cats {
    display: flex;
    gap: 10px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .cat-btn {
    padding: 8px 20px;
    border-radius: 20px;
    border: 1.5px solid var(--warm);
    background: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--brown-mid);
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 400;
  }

  .cat-btn:hover, .cat-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--white);
  }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
  }

  .card {
    background: var(--white);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 2px 16px var(--shadow);
    transition: transform 0.2s, box-shadow 0.2s;
    animation: fadeUp 0.4s ease both;
  }

  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 28px var(--shadow);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-img {
    height: 140px;
    background: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 52px;
    position: relative;
  }

  .card-body { padding: 16px; }

  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    margin-bottom: 4px;
  }

  .card-cat {
    font-size: 11px;
    color: var(--brown-mid);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 12px;
    font-weight: 300;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .price {
    font-size: 18px;
    font-weight: 600;
    color: var(--accent);
  }

  .price span {
    font-size: 12px;
    font-weight: 300;
    color: var(--brown-mid);
  }

  .qty-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .qty-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--warm);
    background: var(--cream);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--brown);
    transition: all 0.15s;
    font-weight: 300;
  }

  .qty-btn:hover { border-color: var(--accent); color: var(--accent); }

  .qty-num { font-size: 14px; font-weight: 500; min-width: 16px; text-align: center; }

  .add-btn {
    background: var(--accent);
    color: var(--white);
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .add-btn:hover { background: #B36A30; }

  .tag-out {
    position: absolute;
    top: 10px; right: 10px;
    background: rgba(61,43,31,0.7);
    color: #fff;
    font-size: 10px;
    border-radius: 6px;
    padding: 3px 8px;
    letter-spacing: 0.5px;
  }

  /* CART MODAL */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(61,43,31,0.4);
    z-index: 200;
    backdrop-filter: blur(2px);
  }

  .overlay.show { display: flex; align-items: flex-end; justify-content: flex-end; }

  .cart-panel {
    background: var(--white);
    width: 380px;
    height: 100vh;
    padding: 32px 28px;
    overflow-y: auto;
    box-shadow: -8px 0 32px var(--shadow);
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
  }

  .cart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
  }

  .cart-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
  }

  .close-btn {
    background: var(--cream);
    border: none;
    border-radius: 50%;
    width: 36px; height: 36px;
    font-size: 18px;
    cursor: pointer;
    color: var(--brown);
    display: flex; align-items: center; justify-content: center;
  }

  .cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid var(--warm);
  }

  .ci-name { font-size: 14px; font-weight: 500; }
  .ci-qty { font-size: 12px; color: var(--brown-mid); }
  .ci-price { font-weight: 600; color: var(--accent); }

  .cart-total {
    display: flex;
    justify-content: space-between;
    padding: 20px 0 8px;
    font-size: 16px;
    font-weight: 500;
  }

  .cart-total strong { color: var(--accent); font-size: 20px; }

  .order-btn {
    width: 100%;
    padding: 16px;
    background: var(--accent);
    color: var(--white);
    border: none;
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 12px;
    transition: background 0.2s;
  }

  .order-btn:hover { background: #B36A30; }

  .empty-cart {
    text-align: center;
    padding: 60px 0;
    color: var(--brown-mid);
    font-size: 14px;
  }

  .empty-cart .icon { font-size: 48px; display: block; margin-bottom: 12px; }

  /* SUCCESS */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--green);
    color: #fff;
    padding: 14px 28px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    z-index: 999;
    transition: transform 0.3s ease;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<nav>
  <div class="nav-logo">🍽 Асхана</div>
  <div class="nav-links">
    <a href="menu.html" class="nav-link active">🍽 Мәзір</a>
    <a href="orders.html" class="nav-link">📋 Тапсырыстар</a>
    <a href="#" class="nav-link" onclick="logout()">🚪 Шығу</a>
  </div>
  <div class="nav-right">
    <div class="balance-badge">💳 Баланс: <strong id="balance">5 000 ₸</strong></div>
    <button class="cart-btn" onclick="openCart()">
      🛒 Себет <span class="cart-count" id="cart-count">0</span>
    </button>
  </div>
</nav>

<main>
  <div class="page-title">Бүгінгі мәзір</div>
  <div class="page-sub">Тағам таңдап, тапсырыс беріңіз</div>

  <div class="cats">
    <button class="cat-btn active" onclick="filterCat('all', this)">Барлығы</button>
    <button class="cat-btn" onclick="filterCat('first', this)">🍲 Бірінші тағам</button>
    <button class="cat-btn" onclick="filterCat('second', this)">🍖 Екінші тағам</button>
    <button class="cat-btn" onclick="filterCat('salad', this)">🥗 Салат</button>
    <button class="cat-btn" onclick="filterCat('drink', this)">🍵 Сусын</button>
  </div>

  <div class="grid" id="menu-grid"></div>
</main>

<!-- Cart -->
<div class="overlay" id="overlay" onclick="closeCart(event)">
  <div class="cart-panel">
    <div class="cart-header">
      <div class="cart-title">Себет</div>
      <button class="close-btn" onclick="closeCart()">✕</button>
    </div>
    <div id="cart-items"></div>
  </div>
</div>

<div class="toast" id="toast">✓ Тапсырыс сәтті берілді!</div>

<script>
const API = 'http://127.0.0.1:8000';
let MENU = [];
let cart = {};
let balance = 0;
let currentCat = 'all';

const EMOJI = {
  first: '🍲', second: '🍖', salad: '🥗', drink: '🍵'
};
const EMOJI_MAP = {
  'Борщ':'🍲','Сорпа':'🥣','Лагман':'🍜','Бефстроганов':'🍖',
  'Балық':'🐟','Пилав':'🍚','Цезарь':'🥗','Оливье':'🥙',
  'Шай':'🍵','Компот':'🧃'
};

async function init() {
  const userStr = localStorage.getItem('user');
  if (!userStr) { window.location.href = 'login.html'; return; }
  const user = JSON.parse(userStr);
  balance = parseFloat(user.balance) || 0;
  document.getElementById('balance').textContent = balance.toLocaleString() + ' ₸';

  await loadMenu();
}

async function loadMenu() {
  try {
    const res = await fetch(`${API}/api/menu/`, {
      headers: { 'Authorization': 'Bearer ' + localStorage.getItem('access') }
    });
    if (res.status === 401) { window.location.href = 'login.html'; return; }
    const data = await res.json();
    MENU = data.results || data;
    renderMenu();
  } catch(e) {
    console.error(e);
  }
}

function renderMenu() {
  const grid = document.getElementById('menu-grid');
  const items = currentCat === 'all' ? MENU : MENU.filter(i => i.category === currentCat);
  grid.innerHTML = items.map((item, idx) => `
    <div class="card" style="animation-delay:${idx * 0.06}s">
      <div class="card-img">
        ${EMOJI_MAP[item.name] || EMOJI[item.category] || '🍽'}
        ${item.quantity_available === 0 ? '<span class="tag-out">Таусылды</span>' : ''}
      </div>
      <div class="card-body">
        <div class="card-name">${item.name}</div>
        <div class="card-cat">${catLabel(item.category)}</div>
        <div class="card-footer">
          <div class="price">${item.price} <span>₸</span></div>
          ${item.quantity_available > 0
            ? (cart[item.id]
              ? `<div class="qty-row">
                  <button class="qty-btn" onclick="changeQty(${item.id},-1)">−</button>
                  <span class="qty-num">${cart[item.id]}</span>
                  <button class="qty-btn" onclick="changeQty(${item.id},1)">+</button>
                </div>`
              : `<button class="add-btn" onclick="addToCart(${item.id})">+ Қос</button>`)
            : '<span style="font-size:12px;color:var(--brown-mid)">—</span>'
          }
        </div>
      </div>
    </div>
  `).join('');
}

function catLabel(c) {
  const map = { first:'Бірінші тағам', second:'Екінші тағам', salad:'Салат', drink:'Сусын' };
  return map[c] || c;
}

function addToCart(id) { cart[id] = 1; updateCartCount(); renderMenu(); }

function changeQty(id, d) {
  cart[id] = (cart[id] || 0) + d;
  if (cart[id] <= 0) delete cart[id];
  updateCartCount(); renderMenu(); renderCartItems();
}

function updateCartCount() {
  const total = Object.values(cart).reduce((a,b) => a+b, 0);
  document.getElementById('cart-count').textContent = total;
}

function openCart() { document.getElementById('overlay').classList.add('show'); renderCartItems(); }

function closeCart(e) {
  if (!e || e.target === document.getElementById('overlay'))
    document.getElementById('overlay').classList.remove('show');
}

function renderCartItems() {
  const el = document.getElementById('cart-items');
  const keys = Object.keys(cart);
  if (keys.length === 0) {
    el.innerHTML = `<div class="empty-cart"><span class="icon">🛒</span>Себет бос</div>`;
    return;
  }
  let total = 0;
  let html = keys.map(id => {
    const item = MENU.find(m => m.id == id);
    const sum = parseFloat(item.price) * cart[id];
    total += sum;
    return `<div class="cart-item">
      <div>
        <div class="ci-name">${EMOJI_MAP[item.name] || '🍽'} ${item.name}</div>
        <div class="ci-qty">${cart[id]} дана × ${item.price} ₸</div>
      </div>
      <div class="ci-price">${sum} ₸</div>
    </div>`;
  }).join('');
  html += `<div class="cart-total"><span>Жиыны:</span><strong>${total} ₸</strong></div>`;
  html += `<button class="order-btn" onclick="placeOrder(${total})">Тапсырыс беру</button>`;
  el.innerHTML = html;
}

async function placeOrder(total) {
  if (balance < total) { alert('Баланс жеткіліксіз!'); return; }

  const items = Object.entries(cart).map(([id, qty]) => ({
    menu_item: parseInt(id),
    quantity: qty
  }));

  const res = await fetch(`${API}/api/orders/`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + localStorage.getItem('access')
    },
    body: JSON.stringify({ items })
  });

  const data = await res.json();

  if (res.ok) {
    balance -= total;
    document.getElementById('balance').textContent = balance.toLocaleString() + ' ₸';
    // localStorage-дегі балансты жаңарт
    const user = JSON.parse(localStorage.getItem('user'));
    user.balance = balance;
    localStorage.setItem('user', JSON.stringify(user));

    cart = {};
    updateCartCount();
    closeCart();
    await loadMenu(); // Санды жаңарту үшін
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  } else {
    alert(data.error || 'Қате орын алды!');
  }
}

function filterCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderMenu();
}

async function logout() {
  const refresh = localStorage.getItem('refresh');
  await fetch(`${API}/api/auth/logout/`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + localStorage.getItem('access')
    },
    body: JSON.stringify({ refresh })
  });
  localStorage.clear();
  window.location.href = 'login.html';
}

init();
</script>
</body>
</html>
